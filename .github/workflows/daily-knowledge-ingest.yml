name: Knowledge ingest (bootstrap + bi-daily)

on:
  schedule:
    # UTC 02:00 every 2 days ≈ 北京时间 10:00 隔日
    - cron: "0 2 */2 * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Force bootstrap (20 types)"
        type: boolean
        default: false
      force:
        description: "Ignore 2-day interval"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
  # 完整取图需自建 Runner：
  # runs-on: [self-hosted, afsa-data]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pillow numpy

      - name: Sync dataset catalog snapshot
        run: |
          if [ -f "${AFSA_REGISTRY_PATH:-}" ]; then
            python3 scripts/sync_dataset_catalog.py
          else
            echo "No local registry on runner; using committed data/dataset_catalog.json"
          fi
        env:
          AFSA_REGISTRY_PATH: ${{ vars.AFSA_REGISTRY_PATH }}

      - name: Ingest (bootstrap or bi-daily update)
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.bootstrap }}" = "true" ]; then ARGS="$ARGS --bootstrap"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 scripts/daily_ingest.py $ARGS
        env:
          AFSA_REGISTRY_PATH: ${{ vars.AFSA_REGISTRY_PATH }}

      - name: Commit batch
        run: |
          git config user.name "afsa-knowledge-bot"
          git config user.email "afsa-knowledge-bot@users.noreply.github.com"
          git add data/disease_pest/ data/control/ data/general/ data/catalog/ data/knowledge.db 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Knowledge ingest: bootstrap or bi-daily disease/pest batch"
          git push
