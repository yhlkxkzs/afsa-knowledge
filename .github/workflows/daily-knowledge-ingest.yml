name: Daily knowledge ingest

on:
  schedule:
    # UTC 02:00 ≈ 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
  # 若需从本地 disease_recognition 目录取图，改为：
  # runs-on: [self-hosted, afsa-data]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pillow numpy

      - name: Sync dataset catalog snapshot
        run: |
          if [ -f "${AFSA_REGISTRY_PATH:-}" ]; then
            python3 scripts/sync_dataset_catalog.py
          else
            echo "No local registry on runner; using committed data/dataset_catalog.json"
          fi
        env:
          AFSA_REGISTRY_PATH: ${{ vars.AFSA_REGISTRY_PATH }}

      - name: Daily ingest (types + images + bilingual text)
        run: python3 scripts/daily_ingest.py
        env:
          AFSA_REGISTRY_PATH: ${{ vars.AFSA_REGISTRY_PATH }}

      - name: Commit daily batch
        run: |
          git config user.name "afsa-knowledge-bot"
          git config user.email "afsa-knowledge-bot@users.noreply.github.com"
          git add data/knowledge_items.json data/knowledge_items_en.json data/ingest_history.json data/images/ data/knowledge.db 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily ingest: disease/pest types with gallery and bilingual content"
          git push
